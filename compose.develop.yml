# The development server is started with the command:
# docker compose -f compose.develop.yml up --build
# It builds the Dockerfile's dev stage (IPython, ipdb, gunicorn --reload, one worker with 4 threads) and
# mounts ./app over /app, so a code change reloads the app without a rebuild. Rebuild after
# a change to app/requirements*.txt or the Dockerfile. See README, "Development".

services:
  nginx_nuki:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/nginx:/etc/nginx/ssl:ro
    restart: always
    depends_on:
      - webapp_nuki


  webapp_nuki:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: webapp-nuki
    volumes:
      # The code. Not :ro, as the env file below is mounted inside it: docker creates the
      # mount point app/secrets/.env.development in the checkout (ignored by .gitignore).
      - ./app:/app
      - ./secrets/webapp_nuki.dev.env:/app/secrets/.env.development:ro
    ports:
      - 8050:8050
    stdin_open: true # docker run -i: for ipdb, through docker attach webapp-nuki
    tty: true        # docker run -t
    environment:
      - APP_ENV=development
      - DASH_ASYNC_SUPPORT=0
      - PYTHONDONTWRITEBYTECODE=1   # no __pycache__ in the mounted ./app


# To (re)build images:       docker compose -f compose.develop.yml build
# To run/start images:       docker compose -f compose.develop.yml up
# To run/start images and leave running: docker compose -f compose.develop.yml up --detach     (or -d)
# To enter specific image:   docker compose exec -ti webapp_qeqert02 /bin/bash